<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Analytics')}"></head>

<style>
    .analytics-container {
        max-width: 1000px;
        margin: 2rem auto;
        padding: 0 1.5rem;
    }

    .analytics-header {
        margin-bottom: 2.5rem;
    }

    .analytics-header h1 {
        font-size: 1.8rem;
        font-weight: 800;
        color: var(--text-primary);
        margin: 0;
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }

    /* Stats Grid */
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1.5rem;
        margin-bottom: 2rem;
    }

    .stat-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
        box-shadow: var(--card-shadow);
        padding: 1.5rem;
        text-align: center;
        transition: transform 0.2s;
    }

    .stat-card:hover {
        transform: translateY(-2px);
    }

    .stat-value {
        font-size: 2rem;
        font-weight: 800;
        color: var(--primary);
        margin-bottom: 0.25rem;
    }

    .stat-label {
        color: var(--text-secondary);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 700;
    }

    /* Main Content Grid */
    .content-grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 2rem;
    }

    .data-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
        box-shadow: var(--card-shadow);
        padding: 1.5rem;
    }

    .data-card h3 {
        margin: 0 0 1.5rem;
        font-size: 1.1rem;
        font-weight: 800;
        color: var(--text-primary);
    }

    .chart-placeholder {
        height: 300px;
        background: #fcfcfc;
        border: 2px dashed var(--border-color);
        border-radius: var(--radius-sm);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
        gap: 1rem;
    }

    .location-list {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
    }

    .location-item {
        margin-bottom: 0.5rem;
    }

    .location-info {
        display: flex;
        justify-content: space-between;
        margin-bottom: 0.5rem;
        font-size: 0.9rem;
    }

    .progress-bar {
        height: 8px;
        background: var(--bg-page);
        border-radius: 4px;
        overflow: hidden;
    }

    .progress-fill {
        height: 100%;
        background: var(--primary);
        border-radius: 4px;
    }

    @media (max-width: 850px) {
        .content-grid {
            grid-template-columns: 1fr;
        }
    }
</style>

<body class="animate-fade-in">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="analytics-container">
        <div class="analytics-header">
            <h1><i class="fas fa-chart-line"></i> Insights & Performance</h1>
            <p style="color:var(--text-secondary); margin-top:0.4rem;">Overview of your profile reach and engagement.
            </p>
        </div>

        <!-- Top Stats -->
        <div class="stats-grid">
            <div class="stat-card animate-fade-in" style="animation-delay: 0.1s;">
                <div class="stat-value" th:text="${totalViews}">1.2k</div>
                <div class="stat-label">Profile Reach</div>
            </div>
            <div class="stat-card animate-fade-in" style="animation-delay: 0.2s;">
                <div class="stat-value" th:text="${engagementRate}">4.5%</div>
                <div class="stat-label">Engagement</div>
            </div>
            <div class="stat-card animate-fade-in" style="animation-delay: 0.3s;">
                <div class="stat-value" style="color: #10b981;" th:text="${totalLikes}">342</div>
                <div class="stat-label">Total Likes</div>
            </div>
            <div class="stat-card animate-fade-in" style="animation-delay: 0.4s;">
                <div class="stat-value" style="color: #6366f1;" th:text="${totalShares}">128</div>
                <div class="stat-label">Total Shares</div>
            </div>
        </div>

        <div class="content-grid">
            <!-- Chart Card -->
            <div class="data-card animate-fade-in" style="animation-delay: 0.5s;">
                <h3>Growth Trends</h3>
                <div class="chart-placeholder">
                    <i class="fas fa-chart-area" style="font-size:2.5rem; opacity:0.1;"></i>
                    <p style="font-size:0.9rem;">Interactive trends visualization will appear here.</p>
                </div>
            </div>

            <!-- Demographics Card -->
            <div class="data-card animate-fade-in" style="animation-delay: 0.6s;">
                <h3>Audience Location</h3>
                <div class="location-list">
                    <div class="location-item">
                        <div class="location-info">
                            <span>New York, NY</span>
                            <span style="font-weight:700; color:var(--primary);">42%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: 42%;"></div>
                        </div>
                    </div>

                    <div class="location-item">
                        <div class="location-info">
                            <span>London, UK</span>
                            <span style="font-weight:700; color:var(--primary);">28%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: 28%;"></div>
                        </div>
                    </div>

                    <div class="location-item">
                        <div class="location-info">
                            <span>Berlin, DE</span>
                            <span style="font-weight:700; color:var(--primary);">15%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: 15%;"></div>
                        </div>
                    </div>

                    <div class="location-item">
                        <div class="location-info">
                            <span>Others</span>
                            <span style="font-weight:700; color:var(--primary);">15%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: 15%;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
