<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | RevConnect'">RevConnect</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script th:src="@{/js/main.js}" defer></script>
</head>

<body>

    <nav th:fragment="navbar" class="navbar">
        <div class="logo">
            <a th:href="@{/feed}"
                style="font-size:1.5rem; font-weight:800; color:var(--primary); text-decoration:none;">
                RevConnect
            </a>
        </div>

        <div class="search-bar" style="flex-grow:1; margin:0 2rem; max-width:420px;">
            <form th:action="@{/search}" method="get" style="position:relative;">
                <i class="fas fa-search"
                    style="position:absolute; left:1rem; top:50%; transform:translateY(-50%); color:var(--text-secondary); font-size:0.85rem;"></i>
                <input type="text" name="q" placeholder="Search users, #hashtags..."
                    style="width:100%; padding:0.6rem 1rem 0.6rem 2.5rem; border-radius:4px; background:var(--bg-page); border:1px solid var(--border-color); color:var(--text-primary); outline:none; font-size:0.9rem; box-sizing:border-box;">
            </form>
        </div>

        <div class="nav-links">
            <a th:href="@{/feed}" class="nav-item"><i class="fas fa-home"></i><span>Feed</span></a>
            <a th:href="@{/network}" class="nav-item"><i class="fas fa-users"></i><span>Network</span></a>

            <a th:if="${user != null && (user.role.name() == 'CREATOR' || user.role.name() == 'BUSINESS')}"
                th:href="@{/analytics}" class="nav-item"><i class="fas fa-chart-line"></i><span>Analytics</span></a>

            <a th:href="@{/messages}" class="nav-item" style="position:relative;">
                <i class="fas fa-envelope"></i>
                <span th:if="${unreadMessageCount != null && unreadMessageCount > 0}"
                    style="position:absolute; top:-4px; right:4px; background:#e63946; color:white; border-radius:50%; width:16px; height:16px; font-size:0.6rem; display:flex; align-items:center; justify-content:center; font-weight:700;"
                    th:text="${unreadMessageCount}"></span>
                <span>Messages</span>
            </a>

            <a th:href="@{/notifications}" class="nav-item" style="position:relative;">
                <i class="fas fa-bell"></i>
                <span th:if="${unreadCount != null && unreadCount > 0}"
                    style="position:absolute; top:-4px; right:4px; background:#e63946; color:white; border-radius:50%; width:16px; height:16px; font-size:0.6rem; display:flex; align-items:center; justify-content:center; font-weight:700;"
                    th:text="${unreadCount}"></span>
                <span>Notifications</span>
            </a>

            <div th:if="${user != null}" style="margin-left:0.5rem;">
                <a th:href="@{'/profile/' + ${user.username}}" class="btn btn-primary"
                    style="font-size:0.85rem; padding:0.4rem 0.9rem; gap:0.5rem;">
                    <span th:if="${user.profilePictureUrl == null || user.profilePictureUrl.isEmpty()}">
                        <i class="fas fa-user-circle"></i> [[${user.username}]]
                    </span>
                    <span th:if="${user.profilePictureUrl != null && !user.profilePictureUrl.isEmpty()}"
                        style="display:flex; align-items:center; gap:0.5rem;">
                        <img th:src="${user.profilePictureUrl}" alt=""
                            style="width:22px; height:22px; border-radius:4px; object-fit:cover; flex-shrink:0;">
                        [[${user.username}]]
                    </span>
                </a>
            </div>

            <form th:action="@{/logout}" method="post" style="margin:0;">
                <button type="submit"
                    style="background:transparent; border:none; color:var(--text-secondary); cursor:pointer; padding:0.5rem; border-radius:4px; transition:color 0.2s;"
                    title="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </form>
        </div>
    </nav>

    <style>
        /* Fragment-specific overrides if needed */
        .nav-item i {
            font-size: 1.1rem;
        }
    </style>

</body>

</html>
